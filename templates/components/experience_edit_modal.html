<div id="edit-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form edit experience"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form edit experience">×</button>

        <h2 id="edit-experience-modal-title">Edit experience</h2>
        <form id="edit-experience-form" class="project-form">
            <input type="hidden" name="id">

            <div class="form-group">
                <label for="edit-title">Title</label>
                <input type="text" id="edit-title" name="title" required>
            </div>
            <div class="form-group">
                <label for="edit-description">Description</label>
                <textarea id="edit-description" name="description" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label for="edit-category">Category</label>
                <input type="text" id="edit-category" name="category">
            </div>
            <div class="form-group">
                <label for="edit-thumbnail">Thumbnail</label>
                <input type="url" id="edit-thumbnail" name="thumbnail">
            </div>
            <div class="form-group">
                <label for="edit-started_at">Started at</label>
                <input type="datetime-local" id="edit-started_at" name="started_at">
            </div>
            <div class="form-group">
                <label for="edit-ended_at">Ended at</label>
                <input type="datetime-local" id="edit-ended_at" name="ended_at">
            </div>

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save</button>
            </div>
        </form>
    </div>
</div>
