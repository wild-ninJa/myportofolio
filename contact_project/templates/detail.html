<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ contact.name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand">Django + HTMX</a>
        </div>
    </header>

    <main>
        <h1>Detail Kontak</h1>
        <dl>
            <dt>Nama</dt>
            <dd>{{ contact.name }}</dd>
            <dt>Email</dt>
            <dd>{{ contact.email }}</dd>
        </dl>
        <a href="{% url 'main:contact_list' %}">Kembali</a>
    </main>
</body>
</html>
